<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="OpenAgents — Self-hosted AI agents that live in your team chat.">
  <title>OpenAgents</title>
  <desc>Self-hosted AI agents that live in your team chat.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#101A33"/>
      <stop offset="100%" stop-color="#0A0F1E"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C8CFF"/>
      <stop offset="100%" stop-color="#4CC9E8"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5865F2" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#8FA0D0" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <circle cx="1010" cy="250" r="380" fill="url(#glow)"/>

  <!-- ── left: wordmark ───────────────────────────────────────── -->

  <!-- terminal-ish mark -->
  <g transform="translate(88,150)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M17 22 L29 30 L17 38" fill="none" stroke="url(#accent)" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="34" y1="39" x2="45" y2="39" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="170" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">OpenAgents</text>

  <text x="88" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600" fill="#E6ECFF">Self-hosted AI agents</text>
  <text x="88" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="600" fill="#E6ECFF">that live in your team chat.</text>

  <text x="88" y="382" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="19" fill="#93A2C7">They remember what was said, answer when asked —</text>
  <text x="88" y="410" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="19" fill="#93A2C7">and speak up on their own when they notice something.</text>

  <!-- feature pills -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(88,458)">
      <rect width="186" height="40" rx="20" fill="#7C8CFF" fill-opacity="0.12" stroke="#7C8CFF" stroke-opacity="0.45"/>
      <text x="93" y="26" fill="#B9C4FF" text-anchor="middle">Runs on your machine</text>
    </g>
    <g transform="translate(288,458)">
      <rect width="150" height="40" rx="20" fill="#4CC9E8" fill-opacity="0.12" stroke="#4CC9E8" stroke-opacity="0.45"/>
      <text x="75" y="26" fill="#9BE0F2" text-anchor="middle">Local SQLite log</text>
    </g>
    <g transform="translate(452,458)">
      <rect width="168" height="40" rx="20" fill="#9B8CFF" fill-opacity="0.12" stroke="#9B8CFF" stroke-opacity="0.45"/>
      <text x="84" y="26" fill="#C7BCFF" text-anchor="middle">Bring your own AI</text>
    </g>
  </g>

  <!-- ── right: chat window ───────────────────────────────────── -->

  <g transform="translate(724,116)">
    <rect x="0" y="0" width="468" height="408" rx="20" fill="#0E1526" stroke="#2B3654" stroke-width="1.5"/>

    <!-- title bar -->
    <line x1="0" y1="52" x2="468" y2="52" stroke="#2B3654" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="5.5" fill="#FF5F57"/>
    <circle cx="46" cy="26" r="5.5" fill="#FEBC2E"/>
    <circle cx="66" cy="26" r="5.5" fill="#28C840"/>
    <text x="92" y="32" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="15" fill="#7E8DB5"># team-general</text>

    <!-- human message -->
    <g transform="translate(28,80)">
      <rect width="284" height="62" rx="14" fill="#1A2337"/>
      <text x="18" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="15" fill="#C3CDE6">Whatever happened with the</text>
      <text x="18" y="47" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="15" fill="#C3CDE6">pricing decision last month?</text>
    </g>

    <!-- agent reply -->
    <g transform="translate(72,160)">
      <rect width="368" height="86" rx="14" fill="#5865F2" fill-opacity="0.16" stroke="#5865F2" stroke-opacity="0.55"/>
      <circle cx="-22" cy="20" r="14" fill="url(#accent)"/>
      <text x="18" y="27" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="15" fill="#DCE3FF">Settled on 2026-07-18 in #product —</text>
      <text x="18" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="15" fill="#DCE3FF">three tiers, annual only.</text>
      <text x="18" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="14" fill="#8FA6FF">↳ jump to the message</text>
    </g>

    <!-- unprompted -->
    <g transform="translate(72,268)">
      <rect width="368" height="86" rx="14" fill="#4CC9E8" fill-opacity="0.10" stroke="#4CC9E8" stroke-opacity="0.45"/>
      <circle cx="-22" cy="20" r="14" fill="url(#accent)"/>
      <text x="18" y="26" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="13" font-weight="700" fill="#4CC9E8" letter-spacing="1">UNPROMPTED</text>
      <text x="18" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="15" fill="#D3EEF7">@mika — the migration doc is due</text>
      <text x="18" y="71" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
            font-size="15" fill="#D3EEF7">tomorrow. Still on track?</text>
    </g>
  </g>

  <!-- footer -->
  <text x="88" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="16" fill="#5E6E96">MIT · Python 3.10+ · macOS &amp; Windows · github.com/kabatin/OpenAgents</text>

  <rect x="0" y="636" width="1280" height="4" fill="url(#accent)"/>
</svg>
