name: npm へ公開

# **まだ npm には公開していないので、手動起動だけにしてある。**
# タグ push で自動発火させると、GitHub のリリース用に v* を打っただけで
# 公開が走ってしまう。パッケージ名を決めて初回公開を済ませたら、
# 下の tags トリガを有効にしてよい（docs/11-cli.md の「名前について」）。
#
#   on:
#     push:
#       tags: ["v*"]
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "publish せず、配る中身の確認までで止める"
        type: boolean
        default: true

jobs:
  publish:
    name: openagents を publish
    runs-on: ubuntu-latest
    permissions:
      # provenance（このコードから作られた証明）の署名に要る
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: タグと package.json の版が一致すること
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # ここで止めないと、v0.2.0 のタグから 0.1.1 が公開される。
          # 公開後の版は取り消せないので、事前に落とすしかない
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./cli/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::タグ($tag) と cli/package.json($pkg) がずれています"
            exit 1
          fi
          echo "OK: $pkg"

      - name: テスト
        run: npm test
        working-directory: cli

      - name: 中身の確認（何を配るのかをログに残す）
        run: npm pack --dry-run
        working-directory: cli

      - name: publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 確認のみで終了したことを伝える
        if: ${{ inputs.dry_run }}
        run: echo "::notice::確認だけで終了しました（publish していません）"
