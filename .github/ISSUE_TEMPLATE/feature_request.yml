name: 機能の提案 / Feature request
description: あったらいいと思う機能・改善を教えてください
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。既に入っているかもしれないので、
        [機能一覧](https://github.com/kabatin/OpenAgents/blob/main/docs/00-features.md) を先に見ていただけると助かります。

  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: 機能そのものより、**どういう場面で何に困っているか**を書いてください
      placeholder: |
        議事録から拾ったTODOが、担当者の異動で宙に浮いたまま気づけない
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: こうなってほしい
      placeholder: |
        担当者がサーバーから抜けたら、そのタスクを未割り当てとして知らせてほしい
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代わりに試したこと
      description: 今どう回避しているか。無ければ空欄で構いません
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: どのあたりの話か
      options:
        - label: 会話・回答（聞かれて答える側）
        - label: 自発行動（観察ループ）
        - label: ダッシュボード / セットアップ
        - label: 運用（常駐・自動起動・ログ）
        - label: 新しいプラットフォーム（Slack / LINE / Telegram など）
        - label: ドキュメント
